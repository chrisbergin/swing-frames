# Build the web app and publish it to GitHub Pages.
#
# The site is served from https://chrisbergin.github.io/swing-frames/, which is
# why vite.config.ts sets base to /swing-frames/.
#
# Tests run before the build, so a broken port cannot reach the live URL.

name: Deploy web app

on:
  push:
    branches: [main, web-app]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test

      # Also typechecks: vitest transpiles without checking types.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          # Relative to the repository root, not the working directory.
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
